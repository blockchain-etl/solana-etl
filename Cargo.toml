[package]
name = "blockchain_etl_indexer"
version = "1.0.1"
edition = "2024"
build = "build_proto.rs"

[dependencies]
futures = "0.3.29"
chrono = "0.4.31"
actix-web = "4.3.0"
prometheus = "0.13.3"
actix-web-prom = "0.7.0"
prost = "0.12.1"
prost-build = { version = "0.12.1" }
zstd = "0.12.3"
tokio = { version = "1.34.0", features = ["full", "signal"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
simd-json = { version = "0.11.0", features = ["allow-non-simd"] }
async-channel = "2.1.0"
rand = "0.8.5"
thiserror = "1.0.50"
csv = "1.3.0"
clap = { version = "4.4.8", features = ["derive"] }
log = "0.4.20"
env_logger = "0.10.1"
ctrlc = "3.4.1"
dotenvy = "0.15.7"
base64 = "0.21.5"
borsh = "1"

# PUBLISHERS
#   RabbitMQ Classic
amqprs = { version = "1.4.0", optional = true }

#   RabbitMQ Stream
rabbitmq-stream-client = { version = "0.4.0", optional = true }

#   Google Pub/Sub
google-cloud-pubsub = { version = "0.20.0", optional = true }
google-cloud-googleapis = { version = "0.11.0", optional = true }
google-cloud-auth = { version = "0.12.0", optional = true }

# BLOCKCHAIN-SPECIFIC
#   SOLANA DEPENDENCIES
#solana-address = "=2.6.0"
#solana-sdk = { version = "=4.1.0", optional = true }
solana-message = { version = "=4.5.0", optional = true }
solana-hash = { version = "=4.6.0", optional = true }
solana-pubkey = { version = "=4.3.0", optional = true }
solana-transaction-status = { version = "=4.3.0-beta.0", features = ["agave-unstable-api"],  optional = true }
solana-account-decoder = { version = "=4.3.0-beta.0", features = ["agave-unstable-api"],optional = true }
solana-storage-bigtable = { version = "=4.3.0-beta.0", features = ["agave-unstable-api"], optional = true }
mpl-token-metadata = "5.1.2-alpha.2"

# NON-WINDOWS
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5.4"

[build-dependencies]
prost-build = { version = "0.12.1" }

[profile.release]
lto = true

[features]
# Solana features
SOLANA_BIGTABLE = ["SOLANA"] #, "dep:solana-storage-bigtable"]
SOLANA = ["RPC", "CUSTOM_INDEXING", "dep:solana-message", "dep:solana-pubkey", "dep:solana-transaction-status", "dep:solana-account-decoder", "dep:solana-storage-bigtable"]

# Single vs Separate publishers
SINGLE_PUBLISHER = ["STREAM"]
SEPARATE_PUBLISHERS = ["STREAM"]

# Publisher selection
GOOGLE_PUBSUB = ["STREAM", "STRING_TIMESTAMP", "dep:google-cloud-pubsub", "dep:google-cloud-googleapis", "dep:google-cloud-auth"]
RABBITMQ_STREAM = ["STREAM", "INT_TIMESTAMP", "dep:rabbitmq-stream-client"]
RABBITMQ_CLASSIC = ["STREAM", "INT_TIMESTAMP", "dep:amqprs"]
STREAM = []

# Use an ISO string, or the number of milliseconds since the UNIX epoch for timestamps
STRING_TIMESTAMP = []
INT_TIMESTAMP = []

# Call features
RPC = []
REST = []

# Whether we have a more custom indexing functionality
CUSTOM_INDEXING = []
